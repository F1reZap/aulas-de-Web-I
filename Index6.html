<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frieren2 o retorno de himmell</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .gatilho-magico {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
            padding: 10px 20px;
            border: 2px dashed #3498db;
            border-radius: 5px;
            background-color: #fff;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .gatilho-magico:hover {
            background-color: #3498db;
            color: #fff;
        }

        .foto-interativa {
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <p class="gatilho-magico" onmouseover="colorir()" onmouseout="entristecer()">
        Passe o mouse aqui para ver a mágica
    </p>

    <img 
        id="foto"
        class="foto-interativa"
        src="imgs/img5_PB.jpg" 
        alt="Foto em Preto e Branco"
    >

    <script>
        const imagem = document.getElementById('foto');

        function colorir() {
            imagem.src = "imgs/img5_COL.jpg";
            imagem.alt = "Foto Colorida";
        }

        function entristecer() {
            imagem.src = "imgs/img5_PB.jpg";
            imagem.alt = "Foto em Preto e Branco";
        }
    </script>

</body>
</html>
