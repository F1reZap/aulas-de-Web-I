<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto Invisivel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .caixa {
            background-color: #2eff62; 
            border: 3px dashed black;   
            padding: 30px;              
            margin-top: 15px;
            font-size: 18px;
            
            display: none; 
        }

        .visivel {
            display: block; 
        }

        button {
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <p>Clique no botão para ver a mensagem</p>
    <button onclick="mostrarMensagem()">Ver mensagem</button>

    <div id="mensagem" class="caixa">
        Bem-vindo ao Javascript!
    </div>

    <script>
        function alternarMensagem() {
    const divMensagem = document.getElementById('mensagem');

    // Se o div JÁ contiver a classe 'visivel'
    if (divMensagem.classList.contains('visivel')) {
        divMensagem.classList.remove('visivel'); // Remove a classe (esconde)
    } else {
        divMensagem.classList.add('visivel');    // Adiciona a classe (mostra)
    }
}
    </script>

</body>
</html>
