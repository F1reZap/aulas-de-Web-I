<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAFIO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .caixa {
            background-color: #2eff62;
            border: 3px dashed black;
            padding: 30px;
            margin-top: 15px;
            font-size: 18px;
            display: none; 
        }

        .visivel {
            display: block; 
        }

        button {
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <p>Clique no botão para alternar a mensagem</p>
    <button onclick="alternarMensagem()">mensageiro pangolin</button>

    <div id="mensagem" class="caixa">
        Bem-vindo ao Javascript!
    </div>

    <script>
        function alternarMensagem() {
            const divMensagem = document.getElementById('mensagem');
            
            divMensagem.classList.toggle('visivel');
        }
    </script>

</body>
</html>
